<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NIAR 的個人作品集網站，收錄攝影作品、日常紀錄、個人介紹與聯絡資訊。">
  <meta name="keywords" content="NIAR, portfolio, photography, daily life, personal website">
  <meta name="author" content="NIAR">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://niarlife.online/">
  <title>NIAR Portfolio</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 34px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
      z-index: 1000;
    }

    nav a {
      color: #d8d8d8;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      transition: .3s;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    .hero {
      height: 100vh;
      background-image: url("https://picsum.photos/1200/800");
      background-size: cover;
      background-position: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
    }

    h1 {
      font-size: 60px;
      margin: 0;
    }

    p {
      font-size: 20px;
    }

    .hero-subtitle {
      max-width: 560px;
      margin: 16px 0 0;
      color: #e6e6e6;
      line-height: 1.8;
    }

    .promo-panel {
      margin-top: 30px;
      padding: 18px;
      width: min(560px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(14px);
    }

    .promo-label {
      color: #b8b8b8;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chat-button {
      display: inline-block;
      padding: 14px 28px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.42);
      color: white;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }

    .chat-button:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .chat-button.primary {
      background: white;
      color: #111;
      border-color: white;
    }

    .visitor-count {
      margin-top: 24px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      color: #f2f2f2;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .gallery {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      nav {
        gap: 16px;
        padding: 16px 10px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 12px;
      }

      h1 {
        font-size: 48px;
      }

      .hero-subtitle {
        font-size: 16px;
      }

      .promo-panel {
        padding: 16px;
      }

      .chat-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="active">HOME</a>
    <a href="gallery.html">GALLERY</a>
    <a href="wall.html">WALL</a>
    <a href="chat.html">CHAT</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
    <a href="daily.html">DAILY</a>
  </nav>

  <section class="hero">
    <h1>NIAR</h1>
    <p class="hero-subtitle">Chat with me directly, follow updates on Telegram, or support private photo stories on Patreon.</p>

    <div class="promo-panel">
      <p class="promo-label">CONNECT WITH NIAR</p>
      <div class="hero-actions">
        <a class="chat-button primary" href="chat.html">OPEN CHAT</a>
        <a class="chat-button" href="https://t.me/niarqqq" target="_blank" rel="noopener noreferrer">TELEGRAM</a>
        <a class="chat-button" href="https://www.patreon.com/niarlife" target="_blank" rel="noopener noreferrer">PATREON</a>
      </div>
    </div>

    <div class="visitor-count" id="visitor-count">瀏覽數：載入中...</div>
  </section>

  <section class="gallery">
    <img src="image/japan1.png">
    <img src="image/japan2.png">
    <img src="image/japan3.png">
  </section>

  <script>
    const visitorCount = document.getElementById("visitor-count");
    const fallbackKey = "niar-home-local-views";
    const baseViews = 2343;

    function showLocalViews() {
      const localViews = Number(localStorage.getItem(fallbackKey) || 0) + 1;
      localStorage.setItem(fallbackKey, localViews);
      visitorCount.innerText = `瀏覽數：${baseViews + localViews}`;
    }

    fetch("https://api.countapi.xyz/hit/niar-portfolio/home")
      .then(response => response.json())
      .then(data => {
        visitorCount.innerText = `瀏覽數：${baseViews + data.value}`;
      })
      .catch(showLocalViews);
  </script>

</body>
</html>
