<head>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .hero {
      height: 100vh;
      background-image: url("https://picsum.photos/1200/800");
      background-size: cover;
      background-position: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 60px;
      margin: 0;
    }

    p {
      font-size: 20px;
    }

    .visitor-count {
      margin-top: 24px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      color: #f2f2f2;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .gallery {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">HOME</a>
    <a href="gallery.html">GALLERY</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
    <a href="daily.html">DailyLife</a>
    <a href="scret.html">SECRET</a>
  </nav>

  <section class="hero">
    <h1>NIAR</h1>
    <p>FOLLOW ME</p>
    <div class="visitor-count" id="visitor-count">瀏覽數：載入中...</div>
  </section>

  <section class="gallery">
    <img src="image/japan1.png">
    <img src="image/japan2.png">
    <img src="image/japan3.png">
  </section>

  <script>
    const visitorCount = document.getElementById("visitor-count");
    const fallbackKey = "niar-home-local-views";
    const baseViews = 2343;

    function showLocalViews() {
      const localViews = Number(localStorage.getItem(fallbackKey) || 0) + 1;
      localStorage.setItem(fallbackKey, localViews);
      visitorCount.innerText = `瀏覽數：${baseViews + localViews}`;
    }

    fetch("https://api.countapi.xyz/hit/niar-portfolio/home")
      .then(response => response.json())
      .then(data => {
        visitorCount.innerText = `瀏覽數：${baseViews + data.value}`;
      })
      .catch(showLocalViews);
  </script>

</body>
</html>
