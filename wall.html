<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NIAR 的照片牆，集中展示網站中的所有照片。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://rainzhu.github.io/wall.html">

  <title>NIAR Photo Wall</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #070707;
      color: white;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 34px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
      z-index: 1000;
    }

    nav a {
      color: #d8d8d8;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      transition: .3s;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    .title {
      width: min(1120px, 90%);
      margin: 0 auto;
      padding-top: 140px;
      padding-bottom: 42px;
    }

    .title h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    .title p {
      color: #a8a8a8;
      font-size: 17px;
      line-height: 1.8;
    }

    .wall {
      width: min(1180px, 92%);
      margin: 0 auto;
      columns: 4 240px;
      column-gap: 18px;
      padding-bottom: 90px;
    }

    .photo {
      display: block;
      width: 100%;
      margin-bottom: 18px;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
      background: transparent;
      cursor: pointer;
      break-inside: avoid;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
      transition: transform .35s ease, filter .35s ease;
    }

    .photo:hover img {
      transform: scale(1.025);
      filter: brightness(1.08);
    }

    .loading {
      color: #a8a8a8;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(0, 0, 0, 0.88);
      z-index: 2000;
    }

    .lightbox.open {
      display: grid;
    }

    .lightbox img {
      max-width: 94vw;
      max-height: 88vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }

    .close {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.42);
      color: white;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      nav {
        gap: 16px;
        padding: 16px 10px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 12px;
      }

      .title {
        padding-top: 132px;
      }

      .title h1 {
        font-size: 42px;
      }

      .wall {
        width: min(520px, 92%);
        columns: 2 150px;
        column-gap: 12px;
      }

      .photo {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">HOME</a>
    <a href="gallery.html">GALLERY</a>
    <a href="wall.html" class="active">WALL</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
    <a href="daily.html">DAILY</a>
  </nav>

  <header class="title">
    <h1>PHOTO WALL</h1>
    <p>All photos from NIAR's website, gathered into one wall.</p>
  </header>

  <main class="wall">
    <p class="loading">Loading photos...</p>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" type="button" aria-label="Close">&times;</button>
    <img id="lightbox-img" alt="">
  </div>

  <script>
    const wall = document.querySelector(".wall");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeButton = document.querySelector(".close");
    const imageExtensions = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];
    const imageFolderApi = "https://api.github.com/repos/rainzhu/rainzhu.github.io/contents/image";
    const fallbackPhotos = [
      "image/bg_photo.PNG",
      "image/japan1.png",
      "image/japan2.png",
      "image/japan3.png",
      "image/un_1.png",
      "image/un_2.png",
      "image/un_3.png",
      "image/about.PNG",
      "image/fish.png",
      "image/TMR.png",
      "image/outside.png",
      "image/uni_t.png"
    ];

    function photoNameFromPath(path) {
      return path
        .split("/")
        .pop()
        .replace(/\.[^/.]+$/, "")
        .replace(/[_-]/g, " ");
    }

    function createPhoto(src, name) {
      const button = document.createElement("button");
      const image = document.createElement("img");

      button.className = "photo";
      button.type = "button";
      image.src = src;
      image.alt = name;

      button.appendChild(image);
      button.addEventListener("click", () => {
        lightboxImg.src = image.src;
        lightboxImg.alt = image.alt;
        lightbox.classList.add("open");
      });

      return button;
    }

    function renderPhotos(photos) {
      wall.innerHTML = "";

      photos.forEach(photo => {
        const src = typeof photo === "string" ? photo : photo.download_url;
        const name = typeof photo === "string" ? photoNameFromPath(photo) : photoNameFromPath(photo.name);
        wall.appendChild(createPhoto(src, name));
      });
    }

    function loadFallbackPhotos() {
      renderPhotos(fallbackPhotos);
    }

    fetch(imageFolderApi)
      .then(response => response.json())
      .then(files => {
        const photos = files
          .filter(file => file.type === "file")
          .filter(file => imageExtensions.some(extension => file.name.toLowerCase().endsWith(extension)))
          .sort((a, b) => a.name.localeCompare(b.name));

        if (photos.length > 0) {
          renderPhotos(photos);
        } else {
          loadFallbackPhotos();
        }
      })
      .catch(loadFallbackPhotos);

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    }

    closeButton.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeLightbox();
      }
    });
  </script>
</body>

</html>
