<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rain's Diary</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0d0d0d;
      color: #f5f5f5;

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    /* ===== nav ===== */

    nav {
      position: fixed;
      top: 0;
      width: 100%;

      display: flex;
      justify-content: center;
      gap: 40px;

      padding: 22px;

      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);

      z-index: 999;
    }

    nav a {
      color: #d8d8d8;
      text-decoration: none;

      font-size: 14px;
      letter-spacing: 2px;

      transition: 0.3s;
    }

    nav a:hover {
      color: white;
      opacity: 0.7;
    }

    /* ===== hero ===== */

    .hero {
      width: 90%;
      max-width: 1000px;

      margin: auto;

      padding-top: 180px;
      padding-bottom: 140px;
    }

    .hero h1 {
      font-size: 74px;
      font-weight: 600;

      margin-bottom: 24px;

      letter-spacing: 4px;
    }

    .hero p {
      color: #9f9f9f;

      font-size: 18px;
      line-height: 2;
    }

    /* ===== blog ===== */

    .blog {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 180px;

      padding-bottom: 160px;
    }

    /* ===== post ===== */

    .post {

      width: 90%;
      max-width: 1450px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 80px;
    }

    /* 偶數篇左右反轉 */

    .post:nth-child(even) {
      flex-direction: row-reverse;
    }

    /* ===== slider ===== */

    .slider {
      width: 58%;
      position: relative;
    }

    .slides {

      display: flex;

      overflow-x: auto;

      scroll-snap-type: x mandatory;

      scroll-behavior: smooth;

      border-radius: 30px;

      scrollbar-width: none;
    }

    .slides::-webkit-scrollbar {
      display: none;
    }

    .slides img {

      width: 100%;
      flex-shrink: 0;

      scroll-snap-align: center;

      object-fit: cover;

      border-radius: 30px;

      cursor: pointer;

      transition: 0.4s ease;

      box-shadow:
        0 0 30px rgba(255,255,255,0.05);
    }

    .slides img:hover {
      transform: scale(1.01);
    }

    /* ===== slider button ===== */

    .btn {

      position: absolute;
      top: 50%;

      transform: translateY(-50%);

      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: rgba(0,0,0,0.45);

      color: white;

      font-size: 20px;

      cursor: pointer;

      z-index: 10;

      backdrop-filter: blur(12px);

      transition: 0.3s;
    }

    .btn:hover {
      background: rgba(255,255,255,0.18);
    }

    .prev {
      left: 18px;
    }

    .next {
      right: 18px;
    }

    /* ===== text ===== */

    .post-content {
      width: 34%;
    }

    .post-date {

      color: #666;

      font-size: 13px;
      letter-spacing: 3px;

      margin-bottom: 18px;
    }

    .post-content h2 {

      font-size: 48px;
      font-weight: 500;

      margin-bottom: 28px;
    }

    .post-content p {

      color: #b8b8b8;

      font-size: 17px;

      line-height: 2.2;
    }

    /* ===== tags ===== */

    .tags {

      display: flex;
      gap: 10px;

      flex-wrap: wrap;

      margin-top: 32px;
    }

    .tags span {

      background: #1b1b1b;

      padding: 9px 15px;

      border-radius: 999px;

      color: #999;

      font-size: 13px;
    }

    /* ===== lightbox ===== */

    .lightbox {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.92);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 5000;

      padding: 30px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {

      width: 100%;
      max-width: 1200px;

      border-radius: 20px;
    }

    /* ===== footer ===== */

    footer {

      text-align: center;

      padding: 70px 20px;

      color: #666;

      font-size: 13px;

      letter-spacing: 2px;
    }

    /* ===== mobile ===== */

    @media (max-width: 1000px) {

      nav {
        gap: 20px;
      }

      .hero {
        padding-top: 140px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero p {
        font-size: 16px;
      }

      .post,
      .post:nth-child(even) {

        flex-direction: column;

        gap: 40px;
      }

      .slider {
        width: 100%;
      }

      .post-content {
        width: 100%;
      }

      .post-content h2 {
        font-size: 36px;
      }

    }

  </style>
</head>

<body>

  <!-- ===== nav ===== -->

  <nav>

    <a href="#">HOME</a>
    <a href="#">DIARY</a>
    <a href="#">ABOUT</a>
    <a href="#">CONTACT</a>

  </nav>

  <!-- ===== hero ===== -->

  <section class="hero">

    <h1>Rain's Diary</h1>

    <p>
      記錄一些普通日子。<br>
      有時候是通勤，有時候只是發呆。
    </p>

  </section>

  <!-- ===== blog ===== -->

  <section class="blog">

    <!-- ===== post 1 ===== -->

    <section class="post">

      <!-- 圖片 -->

      <div class="slider">

        <button
          class="btn prev"
          onclick="slide(this,-1)"
        >
          ‹
        </button>

        <div class="slides">

          <img
            src="image/TMR.png"
            onclick="openLightbox(this.src)"
          >

          <img
            src="image/outside.png"
            onclick="openLightbox(this.src)"
          >

          <img
            src="image/train.png"
            onclick="openLightbox(this.src)"
          >

        </div>

        <button
          class="btn next"
          onclick="slide(this,1)"
        >
          ›
        </button>

      </div>

      <!-- 文字 -->

      <div class="post-content">

        <div class="post-date">
          2026 / 05 / 15
        </div>

        <h2>台北通勤</h2>

        <p>
          今天捷運的人還是一樣很多。<br>
          被擠到快貼在門上。<br><br>

          耳機差點掉下來。<br>
          有時候真的很想找一份
          不需要每天早起通勤的工作。
        </p>

        <div class="tags">

          <span>#daily</span>
          <span>#taipei</span>
          <span>#commute</span>

        </div>

      </div>

    </section>

  <!-- ===== footer ===== -->

  <footer>
    NORMAL DAYS ARCHIVE
  </footer>

  <!-- ===== script ===== -->

  <script>

    /* ===== lightbox ===== */

    function openLightbox(src) {

      document
        .getElementById("lightbox")
        .classList
        .add("active");

      document
        .getElementById("lightbox-img")
        .src = src;
    }

    function closeLightbox() {

      document
        .getElementById("lightbox")
        .classList
        .remove("active");
    }

    /* ===== slider ===== */

    function slide(button, direction) {

      const slider =
        button.parentElement.querySelector(".slides");

      const width =
        slider.clientWidth;

      slider.scrollBy({

        left: width * direction,

        behavior: "smooth"

      });
    }

  </script>

</body>

</html>
