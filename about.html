<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>



  <style>

    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* ===== 選單 ===== */

    nav {
      position: fixed;
      top: 0;
      width: 100%;

      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);

      padding: 20px;

      display: flex;
      justify-content: center;
      gap: 40px;

      z-index: 1000;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;

      transition: 0.3s;
    }

    nav a:hover {
      color: cyan;
    }

    /* ===== 標題 ===== */

    .title {
      text-align: center;
      padding-top: 120px;
      padding-bottom: 40px;
    }

    .title h1 {
      font-size: 60px;
      margin: 0;
    }

    .title p {
      color: gray;
      margin-top: 10px;
    }

    /* ===== Gallery ===== */

    .gallery {
      padding: 40px;

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 400px;

      object-fit: cover;

      border-radius: 20px;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

      cursor: pointer;
    }

    /* 滑鼠停留 0.5 秒後放大 */

    .gallery img:hover {
      transform: scale(1.08);

      transition-delay: 0.5s;

      box-shadow: 0 0 30px cyan;
    }

    /* ===== 手機版 ===== */

    @media (max-width: 900px) {

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .gallery {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 40px;
      }

    }

  </style>

</head>

<body>

  <h1>About Me</h1>
  <p>我是 NIAR</p>

  <nav>
    <a href="index.html">HOME</a>
    <a href="gallery.html">GALLERY</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <section class="gallery">
    <img src="image/bg_photo.PNG">
  </section>

</body>
</html>
