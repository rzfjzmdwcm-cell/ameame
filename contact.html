<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="聯絡 NIAR，合作、交流或一般訊息都可以透過 email 聯繫。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://niarlife.online/contact.html">

  <title>NIAR Contact</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #070707;
      color: white;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 34px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
      z-index: 1000;
    }

    nav a {
      color: #d8d8d8;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      transition: .3s;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    .contact {
      width: min(1180px, 90%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 132px 0 72px;
      display: grid;
      grid-template-columns: minmax(280px, 0.82fr) minmax(320px, 1fr);
      gap: 58px;
      align-items: center;
    }

    .contact-copy {
      max-width: 560px;
    }

    .eyebrow {
      color: #9d9d9d;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(44px, 7vw, 78px);
      font-weight: 600;
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 24px;
    }

    .intro {
      color: #b8b8b8;
      font-size: 17px;
      line-height: 1.9;
      margin-bottom: 34px;
    }

    .mail-block {
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .label {
      color: #8f8f8f;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: white;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: .3s;
    }

    .button.primary {
      background: white;
      color: #111;
      border-color: white;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .contact-image {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      background: #111;
    }

    .contact-image img {
      display: block;
      width: 100%;
      height: min(640px, 72vh);
      object-fit: cover;
    }

    @media (max-width: 820px) {
      nav {
        gap: 16px;
        padding: 16px 10px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 12px;
      }

      .contact {
        width: min(620px, 90%);
        grid-template-columns: 1fr;
        gap: 36px;
        padding-top: 132px;
      }

      .contact-image {
        order: -1;
      }

      .contact-image img {
        height: auto;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">HOME</a>
    <a href="gallery.html">GALLERY</a>
    <a href="wall.html">WALL</a>
    <a href="chat.html">CHAT</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html" class="active">CONTACT</a>
    <a href="daily.html">DAILY</a>
  </nav>

  <main class="contact">
    <section class="contact-copy">
      <p class="eyebrow">CONTACT</p>
      <h1>LET'S TALK</h1>
      <p class="intro">
        For collaborations, photography, creative ideas, or simple messages, choose the channel that feels easiest.
      </p>

      <div class="mail-block">
        <p class="label">CONTACT OPTIONS</p>

        <div class="actions">
          <a class="button primary" href="mailto:niarlife33@gmail.com">SEND EMAIL</a>
          <a class="button" href="https://t.me/niarqqq" target="_blank" rel="noopener noreferrer">TELEGRAM</a>
          <a class="button" href="chat.html">OPEN CHAT</a>
        </div>
      </div>
    </section>

    <figure class="contact-image">
      <img src="image/contact/contact.png" alt="NIAR contact image">
    </figure>
  </main>
</body>

</html>
