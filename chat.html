<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NIAR Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 34px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
      z-index: 1000;
    }

    nav a {
      color: #d8d8d8;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      transition: .3s;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    .chat-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 96px 18px 24px;
    }

    .chat-shell {
      width: min(760px, 100%);
      height: min(720px, calc(100vh - 124px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: #111;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: #151515;
    }

    .chat-title h1 {
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .chat-title p {
      color: #9c9c9c;
      font-size: 13px;
    }

    .chat-title p.offline {
      color: #ff9f9f;
    }

    .name-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 8px;
      flex-shrink: 0;
    }

    .name-panel input {
      width: 150px;
      border: 0;
      background: transparent;
      color: white;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    .name-panel input::placeholder {
      color: #777;
    }

    .name-panel button,
    .clear-button,
    .send-button {
      border: 0;
      color: white;
      cursor: pointer;
      font-family: inherit;
    }

    .name-panel button {
      padding: 8px 11px;
      border-radius: 6px;
      background: white;
      color: #111;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .name-panel input:disabled,
    .name-panel button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .admin-layout {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
    }

    .room-list {
      display: none;
      height: min(720px, calc(100vh - 124px));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: #111;
      overflow: hidden;
    }

    .admin-layout .room-list {
      display: block;
    }

    .room-list h2 {
      padding: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: #151515;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .rooms {
      height: calc(100% - 55px);
      overflow-y: auto;
      padding: 10px;
    }

    .room-button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #d8d8d8;
      cursor: pointer;
      padding: 12px;
      text-align: left;
      font-family: inherit;
      transition: 0.2s;
    }

    .room-button:hover,
    .room-button.active {
      background: #232323;
      color: white;
    }

    .room-button strong,
    .room-button span {
      display: block;
    }

    .room-button strong {
      margin-bottom: 4px;
      font-size: 13px;
    }

    .room-button span {
      color: #8b8b8b;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .messages {
      min-height: 0;
      padding: 20px;
      overflow-y: auto;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        #0d0d0d;
      background-size: 100% 44px;
    }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: #777;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .message {
      display: flex;
      margin-bottom: 14px;
    }

    .message.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(78%, 480px);
      padding: 12px 14px;
      border-radius: 8px;
      background: #242424;
      color: #f3f3f3;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble img {
      display: block;
      max-width: min(280px, 100%);
      max-height: 320px;
      border-radius: 6px;
      object-fit: contain;
    }

    .bubble.image-bubble {
      padding: 8px;
    }

    .message.me .bubble {
      background: #f1f1f1;
      color: #111;
    }

    .meta {
      display: block;
      margin-top: 6px;
      color: #8b8b8b;
      font-size: 11px;
    }

    .message.me .meta {
      color: #555;
    }

    .delete-message {
      display: none;
      margin-top: 8px;
      border: 0;
      background: transparent;
      color: #ff9f9f;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .admin-layout .delete-message {
      display: inline-block;
    }

    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: #151515;
    }

    .image-button {
      align-self: end;
      display: grid;
      place-items: center;
      min-width: 46px;
      min-height: 46px;
      border-radius: 8px;
      background: #262626;
      color: #d0d0d0;
      font-size: 20px;
      cursor: pointer;
    }

    .image-button input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .composer textarea {
      width: 100%;
      min-height: 46px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: #0d0d0d;
      color: white;
      font: inherit;
      padding: 12px;
      outline: none;
    }

    .composer textarea:focus {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .clear-button,
    .send-button {
      align-self: end;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 8px;
      letter-spacing: 1px;
      font-size: 13px;
    }

    .clear-button {
      background: #262626;
      color: #d0d0d0;
    }

    .send-button {
      background: white;
      color: #111;
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      nav {
        gap: 16px;
        padding: 16px 10px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 12px;
      }

      .chat-page {
        align-items: stretch;
        padding-top: 126px;
      }

      .admin-layout {
        grid-template-columns: 1fr;
      }

      .room-list {
        height: 190px;
      }

      .chat-shell {
        height: calc(100vh - 150px);
      }

      .chat-header,
      .composer {
        grid-template-columns: 1fr;
      }

      .chat-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .composer {
        display: grid;
        grid-template-columns: auto 1fr 1fr;
      }

      .composer textarea {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">HOME</a>
    <a href="gallery.html">GALLERY</a>
    <a href="wall.html">WALL</a>
    <a href="chat.html" class="active">CHAT</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
    <a href="daily.html">DAILY</a>
  </nav>

  <main class="chat-page">
    <div class="room-list" id="room-list">
      <h2>ROOMS</h2>
      <div class="rooms" id="rooms"></div>
    </div>

    <section class="chat-shell">
      <header class="chat-header">
        <div class="chat-title">
          <h1>PRIVATE CHAT</h1>
          <p id="chat-status">Connecting to Firebase...</p>
        </div>

        <div class="name-panel">
          <input type="text" id="name-input" placeholder="Your name">
          <button type="button" id="save-name">SAVE</button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <label class="image-button" aria-label="Upload image">
          +
          <input type="file" id="image-input" accept="image/*">
        </label>
        <textarea id="message-input" placeholder="Type a message..." required></textarea>
        <button class="clear-button" type="button" id="clear-chat">CLEAR</button>
        <button class="send-button" type="submit">SEND</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      addDoc,
      collection,
      deleteDoc,
      doc,
      getDoc,
      getDocs,
      getFirestore,
      onSnapshot,
      orderBy,
      query,
      serverTimestamp,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDS-_LnVEzcfRoVVYSzjriRvwptIse6nhc",
      authDomain: "niar-fda7f.firebaseapp.com",
      projectId: "niar-fda7f",
      storageBucket: "niar-fda7f.firebasestorage.app",
      messagingSenderId: "315938409879",
      appId: "1:315938409879:web:8919a3f79a71d7d5fac8d2",
      measurementId: "G-5HHXRQK8R4"
    };

    const messagesEl = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("message-input");
    const imageInput = document.getElementById("image-input");
    const clearButton = document.getElementById("clear-chat");
    const sendButton = document.querySelector(".send-button");
    const nameInput = document.getElementById("name-input");
    const saveNameButton = document.getElementById("save-name");
    const chatStatus = document.getElementById("chat-status");
    const chatPage = document.querySelector(".chat-page");
    const roomsEl = document.getElementById("rooms");
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get("admin") === "1";
    const adminKey = "niar-admin";
    const heartbeatMs = 20000;
    const adminOfflineMs = 45000;
    const roomAwayMs = 180000;
    const userIdKey = "niar-chat-user-id";
    const userNameKey = "niar-chat-user-name";
    let currentUserId = isAdmin ? "admin" : localStorage.getItem(userIdKey);
    let currentUserName = isAdmin ? "NIAR" : localStorage.getItem(userNameKey) || "";
    let activeRoomId = isAdmin ? "" : currentUserId;
    let db;
    let messagesRef;
    let unsubscribeMessages;
    let unsubscribeAdminPresence;
    let isAdminAuthorized = !isAdmin;
    let currentRooms = [];
    let adminPresence = null;
    let adminHeartbeatTimer;
    let visitorHeartbeatTimer;
    let roomInitialized = false;

    if (isAdmin) {
      const savedAdmin = sessionStorage.getItem("niar-chat-admin") === "true";
      const inputKey = savedAdmin ? adminKey : prompt("請輸入管理密碼");

      if (inputKey === adminKey) {
        sessionStorage.setItem("niar-chat-admin", "true");
        chatPage.classList.add("admin-layout");
        isAdminAuthorized = true;
      } else {
        setStatus("Admin access denied", true);
        composer.querySelectorAll("textarea, button, input").forEach(element => {
          element.disabled = true;
        });
      }
    }

    if (!currentUserId) {
      currentUserId = crypto.randomUUID();
      localStorage.setItem(userIdKey, currentUserId);
    }

    if (!isAdmin) {
      activeRoomId = currentUserId;
      clearButton.style.display = "none";
      setChatEnabled(false);
    }

    nameInput.value = currentUserName;

    function lockNameInput() {
      if (currentUserName || isAdmin) {
        nameInput.disabled = true;
        saveNameButton.disabled = true;
        saveNameButton.textContent = "LOCKED";
      }
    }

    function requestName() {
      const name = prompt("請輸入你的名字");

      if (name && name.trim()) {
        currentUserName = name.trim();
        localStorage.setItem(userNameKey, currentUserName);
        nameInput.value = currentUserName;
        lockNameInput();
      }
    }

    if (!currentUserName && !isAdmin) {
      requestName();
    }

    lockNameInput();

    function getDisplayName() {
      if (!currentUserName) {
        requestName();
      }

      return currentUserName;
    }

    function setStatus(text, isError = false) {
      chatStatus.textContent = text;
      chatStatus.classList.toggle("offline", isError);
    }

    function isFirebaseConfigured() {
      return Object.values(firebaseConfig).every(value => !value.includes("PASTE_"));
    }

    function formatTime(value) {
      const date = value && typeof value.toDate === "function" ? value.toDate() : new Date(value || Date.now());

      return date.toLocaleTimeString("zh-TW", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function toDate(value) {
      if (!value) {
        return null;
      }

      return typeof value.toDate === "function" ? value.toDate() : new Date(value);
    }

    function isFresh(value, maxAge) {
      const date = toDate(value);
      return date ? Date.now() - date.getTime() <= maxAge : false;
    }

    function setChatEnabled(enabled) {
      if (isAdmin) {
        messageInput.disabled = false;
        imageInput.disabled = false;
        sendButton.disabled = false;
        return;
      }

      messageInput.disabled = !enabled;
      imageInput.disabled = !enabled;
      sendButton.disabled = !enabled;
    }

    function updateVisitorAvailability() {
      if (isAdmin) {
        return;
      }

      const adminOnline = adminPresence && adminPresence.online && isFresh(adminPresence.lastActiveAt, adminOfflineMs);

      setChatEnabled(adminOnline);
      setStatus(adminOnline ? "Online" : "目前 niar 不在線", !adminOnline);
    }

    function roomStatus(room) {
      if (isFresh(room.lastActiveAt, heartbeatMs * 2.5)) {
        return "Online";
      }

      if (isFresh(room.lastActiveAt, roomAwayMs)) {
        return "Away";
      }

      return "Expired";
    }

    function renderMessages(messages) {
      messagesEl.innerHTML = "";

      if (messages.length === 0) {
        messagesEl.innerHTML = '<div class="empty">No messages yet.</div>';
        return;
      }

      messages.forEach(message => {
        const row = document.createElement("div");
        const bubble = document.createElement("div");
        const meta = document.createElement("span");

        const isMine = message.userId === currentUserId || message.sender === "me";
        row.className = `message ${isMine ? "me" : "friend"}`;
        bubble.className = message.type === "image" ? "bubble image-bubble" : "bubble";

        if (message.type === "image") {
          const image = document.createElement("img");
          image.src = message.src;
          image.alt = message.imageName || "Uploaded image";
          bubble.appendChild(image);
        } else {
          bubble.textContent = message.text;
        }

        meta.className = "meta";
        meta.textContent = `${message.name || "Anonymous"} · ${formatTime(message.createdAt || message.localTime)}`;

        bubble.appendChild(meta);

        if (isAdmin) {
          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-message";
          deleteButton.type = "button";
          deleteButton.textContent = "DELETE";
          deleteButton.addEventListener("click", async () => {
            await deleteDoc(doc(db, "chatRooms", activeRoomId, "messages", message.id));
          });
          bubble.appendChild(deleteButton);
        }

        row.appendChild(bubble);
        messagesEl.appendChild(row);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderRooms(rooms) {
      roomsEl.innerHTML = "";

      if (rooms.length === 0) {
        roomsEl.innerHTML = '<div class="empty">No rooms yet.</div>';
        return;
      }

      rooms.forEach(room => {
        const button = document.createElement("button");
        const title = document.createElement("strong");
        const preview = document.createElement("span");

        button.className = `room-button ${room.id === activeRoomId ? "active" : ""}`;
        button.type = "button";
        title.textContent = room.visitorName || "Anonymous";
        preview.textContent = `${roomStatus(room)} · ${room.lastMessage || "No messages yet."}`;

        button.appendChild(title);
        button.appendChild(preview);
        button.addEventListener("click", () => {
          openRoom(room.id);
        });

        roomsEl.appendChild(button);
      });
    }

    async function saveRoomPreview(lastMessage = "") {
      if (!activeRoomId) {
        return;
      }

      const roomData = {
        visitorId: isAdmin ? activeRoomId : currentUserId,
        lastMessage,
        lastMessageAt: serverTimestamp()
      };

      if (!isAdmin) {
        roomData.visitorName = getDisplayName();
        roomData.lastActiveAt = serverTimestamp();
        roomData.online = true;
      }

      await setDoc(doc(db, "chatRooms", activeRoomId), roomData, { merge: true });
    }

    async function touchRoom() {
      if (!activeRoomId || isAdmin) {
        return;
      }

      const roomRef = doc(db, "chatRooms", activeRoomId);
      const roomData = {
        visitorId: currentUserId,
        visitorName: getDisplayName(),
        online: true,
        lastActiveAt: serverTimestamp()
      };

      if (!roomInitialized) {
        const roomSnapshot = await getDoc(roomRef);

        if (!roomSnapshot.exists()) {
          roomData.lastMessage = "No messages yet.";
          roomData.lastMessageAt = serverTimestamp();
        }

        roomInitialized = true;
      }

      await setDoc(roomRef, roomData, { merge: true });
    }

    async function setAdminPresence(online) {
      await setDoc(doc(db, "system", "admin"), {
        name: "niar",
        online,
        lastActiveAt: serverTimestamp()
      }, { merge: true });
    }

    async function deleteRoom(roomId) {
      const roomMessages = await getDocs(collection(db, "chatRooms", roomId, "messages"));
      const deletions = roomMessages.docs.map(item => deleteDoc(item.ref));

      await Promise.all(deletions);
      await deleteDoc(doc(db, "chatRooms", roomId));
    }

    function cleanupExpiredRooms(rooms) {
      rooms.forEach(room => {
        if (!room.lastActiveAt || !isFresh(room.lastActiveAt, roomAwayMs)) {
          deleteRoom(room.id);
        }
      });
    }

    function openRoom(roomId) {
      activeRoomId = roomId;
      messagesRef = collection(db, "chatRooms", activeRoomId, "messages");
      renderMessages([]);
      renderRooms(currentRooms);

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

      const messagesQuery = query(messagesRef, orderBy("createdAt", "asc"));
      unsubscribeMessages = onSnapshot(messagesQuery, snapshot => {
        const messages = snapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));

        renderMessages(messages);
        if (isAdmin) {
          setStatus(`Online · room ${activeRoomId.slice(0, 8)}`);
        } else {
          updateVisitorAvailability();
        }
      }, error => {
        console.error(error);
        setStatus(`Connection failed: ${error.code || "unknown error"}`, true);
      });
    }

    saveNameButton.addEventListener("click", () => {
      if (currentUserName || isAdmin) {
        return;
      }

      currentUserName = nameInput.value.trim();
      localStorage.setItem(userNameKey, currentUserName);
      lockNameInput();
      messageInput.focus();
    });

    nameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        saveNameButton.click();
      }
    });

    composer.addEventListener("submit", async event => {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text) {
        return;
      }

      if (!activeRoomId || !messagesRef) {
        alert("請先選擇一個聊天室。");
        return;
      }

      if (!isAdmin && (!adminPresence || !adminPresence.online || !isFresh(adminPresence.lastActiveAt, adminOfflineMs))) {
        alert("目前 niar 不在線。");
        updateVisitorAvailability();
        return;
      }

      const displayName = getDisplayName();
      if (!displayName) {
        alert("請先輸入名字。");
        return;
      }

      await saveRoomPreview(text);
      await addDoc(messagesRef, {
        type: "text",
        userId: currentUserId,
        name: displayName,
        text,
        localTime: Date.now(),
        createdAt: serverTimestamp()
      });

      messageInput.value = "";
    });

    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const reader = new FileReader();

        reader.addEventListener("load", () => {
          image.src = reader.result;
        });

        reader.addEventListener("error", reject);
        image.addEventListener("error", reject);
        image.addEventListener("load", () => {
          const maxSide = 900;
          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.width = Math.round(image.width * scale);
          canvas.height = Math.round(image.height * scale);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        });

        reader.readAsDataURL(file);
      });
    }

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files[0];

      if (!file) {
        return;
      }

      try {
        if (!activeRoomId || !messagesRef) {
          alert("請先選擇一個聊天室。");
          imageInput.value = "";
          return;
        }

        if (!isAdmin && (!adminPresence || !adminPresence.online || !isFresh(adminPresence.lastActiveAt, adminOfflineMs))) {
          alert("目前 niar 不在線。");
          imageInput.value = "";
          updateVisitorAvailability();
          return;
        }

        const displayName = getDisplayName();
        if (!displayName) {
          alert("請先輸入名字。");
          imageInput.value = "";
          return;
        }

        const src = await resizeImage(file);

        if (src.length > 850000) {
          alert("圖片太大，請換一張較小的照片。");
          imageInput.value = "";
          return;
        }

        await saveRoomPreview("[image]");
        await addDoc(messagesRef, {
          type: "image",
          userId: currentUserId,
          name: displayName,
          src,
          imageName: file.name,
          localTime: Date.now(),
          createdAt: serverTimestamp()
        });

        imageInput.value = "";
        messageInput.focus();
      } catch (error) {
        alert("圖片上傳失敗，請再試一次。");
        imageInput.value = "";
      }
    });

    clearButton.addEventListener("click", async () => {
      if (!isAdmin) {
        return;
      }

      if (!activeRoomId || !messagesRef) {
        alert("請先選擇一個聊天室。");
        return;
      }

      const snapshot = await getDocs(messagesRef);
      const deletions = snapshot.docs.map(item => deleteDoc(item.ref));

      await Promise.all(deletions);
      await saveRoomPreview("No messages yet.");
      messageInput.focus();
    });

    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    window.addEventListener("beforeunload", () => {
      if (adminHeartbeatTimer) {
        clearInterval(adminHeartbeatTimer);
      }

      if (visitorHeartbeatTimer) {
        clearInterval(visitorHeartbeatTimer);
      }

      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

      if (unsubscribeAdminPresence) {
        unsubscribeAdminPresence();
      }

      if (isAdmin && isAdminAuthorized && db) {
        setAdminPresence(false);
      } else if (!isAdmin && db && activeRoomId) {
        setDoc(doc(db, "chatRooms", activeRoomId), {
          online: false,
          lastActiveAt: serverTimestamp()
        }, { merge: true });
      }
    });

    setInterval(updateVisitorAvailability, 10000);

    if (!isAdminAuthorized) {
      renderMessages([]);
    } else if (!isFirebaseConfigured()) {
      setStatus("Paste Firebase config first", true);
      renderMessages([]);
      composer.querySelectorAll("textarea, button, input").forEach(element => {
        element.disabled = true;
      });
    } else {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);

        if (isAdmin) {
          await setAdminPresence(true);
          adminHeartbeatTimer = setInterval(() => {
            setAdminPresence(true);
          }, heartbeatMs);

          const roomsQuery = query(collection(db, "chatRooms"), orderBy("lastMessageAt", "desc"));

          onSnapshot(roomsQuery, snapshot => {
            const rooms = snapshot.docs.map(item => ({
              id: item.id,
              ...item.data()
            }));

            cleanupExpiredRooms(rooms);
            currentRooms = rooms.filter(room => room.lastActiveAt && isFresh(room.lastActiveAt, roomAwayMs));
            renderRooms(currentRooms);

            if (!activeRoomId && currentRooms.length > 0) {
              openRoom(currentRooms[0].id);
            } else if (!activeRoomId) {
              setStatus("Online · waiting for visitors");
            }
          }, error => {
            console.error(error);
            setStatus(`Connection failed: ${error.code || "unknown error"}`, true);
          });
        } else {
          await touchRoom();
          openRoom(activeRoomId);

          unsubscribeAdminPresence = onSnapshot(doc(db, "system", "admin"), snapshot => {
            adminPresence = snapshot.exists() ? snapshot.data() : null;
            updateVisitorAvailability();
          }, error => {
            console.error(error);
            setStatus("目前 niar 不在線", true);
            setChatEnabled(false);
          });

          visitorHeartbeatTimer = setInterval(touchRoom, heartbeatMs);
        }
      } catch (error) {
        console.error(error);
        setStatus("Firebase setup failed", true);
      }
    }
  </script>
</body>

</html>
